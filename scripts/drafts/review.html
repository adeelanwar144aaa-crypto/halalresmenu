  <script type="application/json" id="draft-data">[{"slug":"afghan-cuisine-oxford","name":"Afghan Cuisine","city":"Oxford","cuisine_type":"Kebab, Afghan","generatedAt":"2026-10-13T23:06:45.833Z","meta_title":"Afghan Cuisine Oxford | Kebab & Afghan Restaurant","meta_description":"Afghan Cuisine in Oxford serves kebabs, biryani, mantu and chapli kebab. Open daily 1pm–midnight. £10–20 per person.","intro":"Afghan Cuisine is an Afghan and kebab restaurant on Cowley Road in Oxford, serving grilled kebabs, rice dishes, seafood and traditional Afghan mains. Open every day from 1pm to midnight, it offers meals ranging from £5.99 starters to sharing platters, with most dishes priced between £10 and £20 per person.","sections":[{"heading":"What to order at Afghan Cuisine","body":"Start with Chicken Wings (6 pieces) at £5.99 or Afghani Soup at £5.99. Vegetable Samosas (4 pieces) and Mixed Olives are both £6.49, alongside salad options like Afghani Mix Salad and Paneer Salad.\n\nFor main courses, the Grilled Kebab section offers Single Kobeda with naan for £7.95 or with rice for £10.95. Chicken Tikka comes as a single skewer on naan (£7.95) or rice (£10.95), while Lamb Tikka is £9.45 with naan and £11.95 with rice. Chapli Kebab with naan is £7.95 for one piece or £13.95 for two pieces.\n\nLamb Biryani and Chicken Biryani are £12.95 and £11.95 respectively. Kabuli Pilau comes as Kabuli Pillow with Lamb Shank (£16.95) or Lamb Pieces (£12.95). Mantu, a traditional Afghan dumpling dish, is £12.95.\n\nThe Tandoori Mix combines Lamb Chops, Kobeda and Chicken Tikka, available with naan at £19.95 or rice at £24.95. Afghan Charsi Tikka (2 skewers with naan) costs £14.95. Half Chicken is £9.95 with naan or £14.95 with rice; Full Chicken is £14.95 with naan or £18.95 with rice.\n\nSeafood options include Grilled Seabass with chips (£12.95) and Salmon with rice (£14.95). For sharing, the Afghani Mix Grill platter is £46.95, with a Deal for 3 at £55.95 and a Deal for 6 at £79.95."},{"heading":"Menu range and sides","body":"Afghan Cuisine's menu spans starters, seafood, rice dishes, kebabs, mains, platters and sides. Pricing is accessible: starters and light bites from £1.50 (Plain Naan) to £6.49, kebabs from £7.50 to £19.95 depending on protein and accompaniment, and larger mains and sharing platters up to £79.95.\n\nSide dishes include Okra Bhindi (£7.95), Afghani Aubergine (£8.95), Saag Aloo and Kidney Beans (both £7.95), and Chana Daal (£7.95). Naan comes in Plain (£1.50), Garlic (£3), Kalonji (£2.50) and Afghani varieties (£3.50). Plain Rice is £5.95.\n\nVegetarian options are available: Mixed Olives, Cucumber Yogurt, Hummus, Afghani Mix Salad and Paneer Salad as starters; Vegetable Samosas; vegetable sides like Mix Vegetable and Aloo Keema; and desserts such as Baklava and Ras Malai."},{"heading":"Drinks and desserts","body":"Afghan Cuisine offers traditional hot beverages including Kahwa (small or large, £4.95), Black Turkish Tea (small £4.95, large £6.95) and Desi Chai (£2.95). Fresh juices include Orange, Apple, Carrot, Mango (all £6.95) and Mango Lassi (individual £6.95 or 1L jug £12.95).\n\nSoft drinks include Coca-Cola, Pepsi, Fanta and 7UP in 330ml cans (£2 each) or 1.5L bottles (£3.50). Bottled water is available in 500ml (£2) or 1.5L (£3.50).\n\nDesserts are Afghan and South Asian specialities: Ferinia Traditional Sweet Dessert (£4.50), Baklava 4 pieces (£5.95), Afghan Jalebi 3 pieces (£9.95), Ras Malai 2 pieces (£5.95) and Chocolate Fudge Cake (£5.95)."},{"heading":"Location and hours","body":"Afghan Cuisine is located at 137–139 Cowley Road, Oxford OX4 1HU. The restaurant is open daily from 1pm to midnight. You can reach them on 01865 493165. The restaurant is listed as halal; customers are advised to confirm this directly with the restaurant."}],"wordCount":531,"quality":{"pass":true,"reasons":[]},"source":{"about_raw":"Afghan Cuisine\n\nAfghan Cuisine is an Afghan restaurant at 137-139 Cowley Rd, Oxford (OX4 1HU). It has 4.4 stars on egetarians, there is a battered halloumi burger at £8.10 and a vegetable burger at £6.90.\n\nKebabs include doner (£11.30), chicken (£11.90) and mixed (£14.60). These come in wraps or on chips or salad. Doner roll is £7.50; chicken kebab roll £8.80.\n\nChip-based meals add substance cheaply. Chilli con carne on chips is £12.40; chicken curry on chips also £12.40. Chips with cheese and curry sauce costs £9.70, as do cheesy chips and gravy. A chip butty is £5.40.\n\nPies—steak kidney, chicken and mushroom, or beef and onion—are each £5.40. Jacket potatoes start at £5.40 plain or with butter, rising to £10 for versions topped with cheese and beans, bacon and cheese, tuna mayonnaise, chilli con carne, vegetable chilli, or cheese and coleslaw."},{"heading":"Full menu range and pricing","body":"Breakfast items span £4.20 to £13.50. An egg roll costs £4.20, bacon roll £5.50, sausage roll £5.70. The English breakfast is £13.50. Combinations like egg and bacon roll (£6.50), egg and sausage roll (£6.40), or egg, bacon and sausage roll (£7.50) bridge the morning and lunch.\n\nChips alone range from small (£4.30) to large (£7.60), with a medium at £5. Combinations like chips and cheese (£7.50), chips, cheese and sauce (£7.90), or chips, bacon and cheese (£9.70) cost more.\n\nChicken is available as 1/4 leg (£6.80) or 1/4 breast (£7.20), served with or without small chips. Nuggets come in 5-piece (£4.20) or 10-piece (£7.90) portions.\n\nSausages start at £3 for a large plain sausage or £3.20 battered. Saveloy is £3.30. Small vegetarian sausage costs £1.90, or £2 battered.\n\nSides and extras include onion rings (10 pieces, £4.80), garlic mushrooms (£5.90), curry sauce (£3.75), mushy peas (£3.75), gravy (£3.75), baked beans (£3.75) and coleslaw (£3.75). Battered Mars bar is £2.70, pineapple fritter £2.80, battered halloumi £4. Pickled onion, pickled egg and gherkin are each £1.20.\n\nKids meals cost £6.40 and include fish cake, sausage, battered sausage, vegetable sausage, nuggets or battered veggie sausage, each with chips. Drinks range from water (£1.80) and canned soft drinks (£2.10 each) to large bottles (£3.99)."},{"heading":"Halal status, location and opening times","body":"Atlantic Fish Bar is listed on halalresmenu.com as a halal restaurant. However, customers should confirm the halal status directly with the restaurant before ordering.\n\nThe restaurant is located at 270 Abingdon Road, Oxford OX1 4TA. You can phone 01865 243822 to check the menu or place an order.\n\nOpening hours are Monday to Thursday, 11am to 9pm; Friday and Saturday, 11am to 10pm; and Sunday, 3pm to 8pm. The restaurant takes both sit-in and takeaway orders, and is also available via Just Eat."}],"wordCount":570,"quality":{"pass":true,"reasons":[]},"source":{"about_raw":"Atlantic Fish Bar\n\nAtlantic Fish Bar is a fish and chips takeaway at 270 Abingdon Rd, Oxford (OX1 4TA). Its Google categories are fish and chips takeaway and fast food restaurant. It has 4.2 stars on Google from 448 reviews. Google lists opening hours of 11 am–9 pm Monday to Thursday; 11 am–10 pm Friday and Saturday; 3–8 pm Sunday. Google puts the typical spend at £1–10 per person.\n\nIts Just Eat menu has 129 items, in sections such as “Warming Chips”, “Chips” and “Breakfast”. The reviews cover both sit-down meals and takeaway or delivery orders.\n\nOf the 8 reviews Google shows first, 7 are positive (4 or 5 stars) and none are negative (1 or 2 stars).\n\nPositive reviews praise cod and haddock fried to order with crisp batter, squid rings, a spotless sit-in area, friendly staff and catering for a wedding party, with some customers coming for over a decade.\n\nThe lowest-rated reviews mention reheated, rock-hard or undercooked chips, staff attitude, tasteless reheated kebab meat, a rubbery doner and cheeseburger with soggy onion rings, being asked to pay for extra wrapping, a long hair in a Just Eat order, and oil-soaked cod with curry sauce that seemed off.\n\nSources: Google Maps https://ww rs are both £12.50, whilst Lahem Meshwi (grilled lamb) is the same price.\n\nFor a lighter option, wraps range from £5 to £6.50. Falafel Wrap and Halloumi Wrap are both £5, whilst Shawarma Lamb Sandwich is £6.50 and Taouk Wrap is £6.50. Shawarma Chicken Wrap costs £6 and Kofta Wrap is also £6.\n\nThe mezza selection includes cold and hot options. Cold mezze such as Hummus and Baba Ganoush are £6 each, whilst Vine Leaves cost £5.50. Hot mezze ranges from £6 to £8, with Falafel and Halloumi at £6, Sambousek at £6.50, Hummus bl Awarma and Batata Harra at £7, Lebanese Burger at £7, and Sujuk at £8.\n\nSalads include Tabbouleh (£6.50), Fattoush (£6) and Cucumber Salad with Yogurt (£4). For sweets, Baklava costs £4.50 and Kanafeh is £6. Fresh Lemonade is £3.50 and Fresh Orange Juice is £2.50."},{"heading":"Cedar Lebanese menu and pricing","body":"The menu is organised into ten sections: wraps, platters, charcoal-grilled dishes, cold mezze, hot mezze, salads, sides, beverages, sweets and breakfast mains. Prices span from £1 for Lebanese Pitta Bread to £15 for Mixed Grill. Most main dishes fall between £12 and £15, with wraps and lighter options ranging from £3.50 to £6.50. Mezza dishes typically cost £4 to £8.\n\nVegetarian options are available throughout. Falafel appears as both a wrap (£5) and a hot mezze (£6). Halloumi is available as a wrap (£5) and a hot mezze (£6). Salads include Tabbouleh, Fattoush and Cucumber Salad with Yogurt. Cold mezze such as Hummus and Baba Ganoush are vegetarian, as are sides like Seasoned Rice (£4) and Seasoned Fries (£3.50).\n\nBeverages include soft drinks (£1.80), Fresh Lemonade (£3.50), Fresh Orange Juice (£2.50), Laban Ayran (£2), Jallab (£2.50) and Barbican (£2.70). Breakfast mains like Shakchouka and Bayd bl Awarma are both £7."},{"heading":"Location, halal status and opening times","body":"Cedar Lebanese Restaurant is located at 49 Albert Road, Southsea, Portsmouth, PO5 2SF. You can phone the restaurant on 023 9217 0506.\n\nThe res 8 8975 to place an order or check availability."},{"heading":"What to order at Charcoal Grill","body":"The meal deals offer the best value, bundling a main with chips. The Donner Kebab Meal comes in Regular (£11.99) and Large (£13.99), while the Shish Kebab Meal is Regular (£14.99) or Large (£16.99). Cheese Burger Meals start at £7.99 for a 1/4 pounder.\n\nIf you prefer to order à la carte, the Lamb Shish Kebab is available in Regular (£8.25), Large (£12.95) or XL (£15.99). The Lamb Donner Kebab ranges from Regular (£7.60) to XL (£12.99). For chicken lovers, the Chicken Donner Kebab in Regular size is £8.19, while the Chicken Shish Kebab in the same size is £8.25. Kofte Kebab, a grilled meatball option, costs £8.74 for a Regular portion.\n\nBurgers include the Beef Burger (from £4.95 for 1/4 pounder), Cheese Burger (from £5.49), and the Charcoal Messy Burger (£6.99 for 1/4 pounder or £8.99 for 1/2 pounder). The Charcoal Mega Beast Burger is a larger option at £12.99.\n\nFor mixed kebabs, try the Chicken Shish and Lamb Donner Mix (£12.99 Large, £15.99 XL) or the Lamb Shish and Lamb Donner Mix at the same prices. The Charcoal Grill Sharing Platter is £28.99.\n\nStarters include Hummus and Calamari (both £5.49), Scampi (£5.49), Breaded Garlic Mushrooms (£4.93) and a Salad Portion (£4.39). Vegetarian options include the Falafel Kebab (£6.60), Hummus Kebab and Salad Kebab (both £6.05), plus Veggie Burgers from £4.99.\n\nChips cost £3.30, or you can add cheese for £4.30 (Regular) or £5.40 (Large). Donner meat with chips is available separately: Lamb (£8.49 Regular), Chicken (£8.49 Regular) or Mixed (£8.49 Regular). Chicken Nuggets are sold as 10 pieces (£4.93), 20 pieces (£9.33), or with chips and 10 pieces (£7.13).\n\nDesserts include Chocolate Fudge Cake, Tennessee Toffee Pie and Strawberry Cheesecake (all £4.38). Drinks range from canned soft drinks at £1.50 (Coca-Cola, Pepsi, Tango, 7UP, Dr Pepper) to 1.5-litre bottles at £2.95, Yazoo Milkshakes at £2.25, and Red Bull at £2.50. Water is £1.50 for 500ml."},{"heading":"Halal status, location and contacting Charcoal Grill","body":"Charcoal Grill is listed as a halal restaurant on halalresmenu.com. We recommend confirming halal status directly with the restaurant on 020 8688 8975 if this is important to your choice.\n\nThe address is 6 South End, Croydon CR0 1DL. Opening hours are Tuesday–Thursday and Sunday from 1 pm to midnight, Friday and Saturday 1 pm to 2 am, and closed on Mondays. For orders or queries, call 020 8688 8975."}],"wordCount":517,"quality":{"pass":true,"reasons":[]},"source":{"about_raw":"The Charcoal Grill\n\nThe Charcoal Grill is a kebab shop at 121 Albert Rd, Southsea, Portsmouth, Southsea (PO5 2SQ). Its Google categories are kebab shop, doner kebab restaurant and fast food restaurant. It has 2.8 stars on Google from 112 reviews. Google shows it open every day from 4 pm–2:45 am. Google puts the typical spend at £10–20 per person.\n\nIts Just Eat menu has 75 items, in sections such as “✨ Charcoal Grill Meal Deals ✨”, “Starters🍤🥗🍚🥔” and “Kebabs🍢🔥🥙🍗”.\n\nOf the 8 reviews Google shows first, 5 are positive (4 or 5 stars) and 3 are negative (1 or 2 stars).\n\nPositive reviews praise a doner kebab like those in Belgium, charcoal-grilled kebabs with fresh salad, homemade chilli sauce, burgers and chips, and a friendly family-run counter; a 2-star review liked the crisp chips but found the wings dry.\n\nThe lowest-rated reviews mention a late, cold delivery with pink chicken, a burnt shish and leftover kebab bits, doner meat that seemed days old, hair in uncooked food and sickness, an online order marked delivered that never came with the phone off, bland food, five kebabs all made wrong with old chips, £7 for a can and a small wrap, and wet scampi with a condescending manager.\n\nSources: Google Maps https://www.google.com/maps/place/?q=place_id:ChIJJzRc47pddEgRSJy6HJAgTfw | Rating 2.8 | 112 Google reviews | 14 reviews read (8 most relevant + 6 lowest rated, from the l a main dish range from £7.99, with options like Thali Curry Chicken or Tarka Dhal.\n\nFrom the starters, tandoori options are popular: Half Tandoori Chicken is £9.95 and Full Tandoori Chicken £12.95. Murgh Malai Tikka (chicken in cream and yoghurt marinade) costs £10.95, as do Chicken Sheekh Kebab and Lamb Seekh Kebab. The Exotic Mixed Grill at £18.95 combines several tandoori and kebab items.\n\nMain curry dishes are priced consistently at £10.95 for chicken or lamb: try Karahi Chicken, Butter Chicken, Chicken Tikka Masala, Lamb Rogan Josh or Saag Chicken. Vegetarian mains like Karahi Paneer, Saag Paneer and Palak Paneer are also £9.95–£9.95. For seafood, Prawn Tikka Masala and Jhinga Taka Tak are £14.95 each.\n\nBreads complement most mains. Garlic Naan and Chilli Naan are £3 each, Peshwari Naan £3.95, and Plain Naan £2.45. Paratha options include Aloo Paratha (£4) and Paneer Paratha (£4.45). Bhatura, the deep-fried bread often eaten with chickpea curry, is £2.50.\n\nFinish with Kulfi Ice Cream (Malai, Mango or Pistachio) at £4 each, or Rasmalai at £4.50. Drinks include fresh juices, lassi, milkshakes and hot beverages like Masala Tea (£2.95)."},{"heading":"Menu overview and prices","body":"Lunch meal deals are the cheapest entry point, ranging from £4.99 to £7.99. Indo-Chinese Noodles with chicken, vegetable or paneer are all £5.99. Vegetarian starters span £0.75 (Punjabi Samosa) to £10.45 (Paneer Tikka Sizzler), with most items £5–£7.\n\nMeat starters (Starters section) run £9.95–£18.95. Most main curry dishes cost £10.95, whether chicken, lamb or fish. Vegetarian curries are cheaper at £7.45–£10.95. Biryani dishes with raita cost £8.95–£11.95. Rice sides are £4–£6.45, and breads £2–£4.45.\n\nVegetarian options are well-represented: chaat items (savoury snacks), pakora, paneer dishes and dhal-based curries fill half the menu. Mini meals, rolls and wraps provide light options at £8.45–£10.45. Desserts and hot drinks are all under £6."},{"heading":"Location and halal status","body":"Exotic Karahi is at 264 Farnham Road, Slough SL1 4XL. Phone 01753 551808 to enquire or book.\n\nThe restaurant is listed as halal on this directory. However, halal certification details are not stated in the restaurant's publicly available information. If halal status is important to your choice, contact the restaurant directly on 01753 551808 to confirm their current halal practices and any certification they hold."}],"wordCount":562,"quality":{"pass":false,"reasons":["certification mentioned but not in about_raw","price £50.00 not in menu_data"]},"source":{"about_raw":"Exotic Karahi\n\nExotic Karahi is a Punjabi restaurant at 264 Farnham Rd, Slough (SL1 4XL). Its Google categories are Punjabi restaurant, Asian restaurant, modern Indian restaurant and South Asian restaurant. It has 4.1 stars on Google from 1,331 reviews. Google lists opening hours of 12–10 pm Monday to Friday; 10 am–10 pm Saturday and Sunday. Google puts the typical spend at £10–50 per person.\n\nIts Just Eat menu has 172 items, in sections such as “Lunch Meal Deal”, “Vegetarian Starters” and “Starters”.\n\nOf the 8 reviews Google shows first, 6 are positive (4 or 5 stars) and 1 is negative (1 or 2 stars).\n\nPositive reviews praise the murgh chicken, garlic and chilli naan, bhatura, kebab and tandoori starters, prompt service and a non-halal menu that suits Sikh diners, and advise booking as it fills up quickly.\n\nThe lowest-rated reviews mention a large biryani sold as enough for two that was very small, overpoweringly hot food, greasy, buttery rice and salty bhajis, a refused full refund, a £35 New Year's Eve set menu with starters after 1.5 hours and mains after 2.5 hours, a £10-plus kebab roll on old naan, bland food, slow service and no alcohol served because the licence had expired.\n\nSources: Google Maps https://www.google.com/maps/place/?q=place_id:ChIJLShSEdhkdkgR8EM4fwngLr4 | Rating 4.1 | 1,331 Google reviews | 15 reviews read (8 most relevant + 7 lowest rated, from Chicken Baguette (£7.49), and Lamb Shish Baguette (£7.49)."},{"heading":"Menu and prices","body":"Prices span £0.79 to £33.99. Single item burgers and baguettes fall in the £5–£8 range, while full kebab meals with sides typically cost £9–£12. The larger Persian and Munchbox options reach £15–£17, with the Persian Cuisine Special for 2 at £33.99.\n\nJacket potatoes (£4.99–£12.49) cater to lighter appetites, starting with margarine or cheese (£4.99–£6.59) and rising with chilli con carne or chicken curry (£9.99–£12.49). Chips and extras run £3.49–£12.99, including Chips & Chicken Curry (£12.99) and Rice & Chilli Con Carne (£10.29). Chicken nuggets, strips and popcorn chicken come as individual items (£5.49) or meals (£8.99).\n\nSides include 8 Garlic Breaded Mushrooms (£4.99), 8 Onion Rings (£4.49), Pot of Curry Sauce (£2.89), Box of Salad (£2.29), and Box of Jalapeños (£2.49). Dips range from £0.89 to £0.99. Desserts include Baklava (£4.49) and Caramel Crunch Cheesecake Slice (£3.99). Drinks include standard cans and bottles (£0.79–£3.89) plus Persian Ayran (£2.79)."},{"heading":"Halal status, location and opening times","body":"Oxford Kebab House Persian Cuisine is listed as halal on this directory; customers should confirm directly with the restaurant. The address is 1 Manzil Way, Oxford OX4 1XD. Phone 01865 256060.\n\nOpening hours are 12:00 pm to 11:30 pm Tuesday to Saturday. The restaurant is closed Monday and Sunday."}],"wordCount":460,"quality":{"pass":false,"reasons":["meta_title length 66"]},"source":{"about_raw":"Oxford Kebab House Persian Cuisine\n\nOxford Kebab House Persian Cuisine is a kebab shop at 1 Manzil Way, Oxford (OX4 1XD). Its Google categories are kebab shop, takeaway, Persian restaurant and restaurant. It has 3.8 stars on Google from 208 reviews. Google lists opening hours of 12–11:30 pm Tuesday to Saturday, and shows it closed on Monday and Sunday. Google puts the typical spend at £10–20 per person.\n\nIts Just Eat menu has 96 items, in secti ebab peshawari costs £3.\n\nFor curries, the menu covers Lamb Curry, Lamb Saag and Chicken Curry in regular (£10) or large (£12) sizes. Chicken Channa Masala and Chilli Chicken Jalfrazi (boneless) are also £10. Kebab Rolls—Seekh Kebab or Mixed Grilled Kebab—range from £4 to £8.\n\nDesi Dishes include Nihari and Paya at £12 each, and Curry Pakora (£8–£10). The Desi Karahi section offers 1 kg Lamb Karahi on the bone (£36.99) and 1 kg Chicken Karahi (£26.99).\n\nRice options include Chicken Biryani in regular (£6) or large (£8.50) and Sweet Rice (£5). Vegetarian curries span Mix Veg, Bhindi Masala, Daal and Channa, all priced £6–£9. Masala Fish with naans or rotis and fresh salad is £7.\n\nBreakfast items available at weekends include Puri with Halwa and Channa (£8), Plain Pratha (£2.50), Keema Pratha (£4) and Desi Chai (£2). Lunch meal deals combine a curry dish with rotis or rice and a drink for £7.50–£9."},{"heading":"Menu range and value","body":"The menu spans 11 categories with over 80 items. Pricing sits mostly between £1 and £12 for main dishes, with larger-format items like karahis reaching £36.99. Special offers include 2 Tandoori Roti or 2 Tandoori Naan for £1 each.\n\nLunch meal deals offer good value at £7.50–£9, bundling a curry, bread or rice and a drink. Individual starters and sides are budget-friendly: samosas start at 75p, seekh kebab at £1.50.\n\nVegetarian options run throughout: Veg Pakora, all samosa varieties, Mix Veg, Bhindi Masala, Daal, Channa, Aloo Palak and Red Kidney Beans. Weekend Specials include Nihari and Paya (Lamb) at £12 and £10 respectively. Desserts—Zarda Rice, Gajar Halwa, Halwa and Kheer—range from £3 to £9. Soft drinks, Desi Chai and bottled water complete the offering."},{"heading":"Halal status, location and hours","body":"Rotinaan wala slough is listed as halal on halalresmenu.com. The restaurant is located at 20 Chalvey Rd W, Chalvey, Slough SL1 2PN. Customers are advised to confirm halal status directly with the restaurant l £4.95). Extras like 12 Onion Rings (£6.59) or 12 Garlic Mushrooms (£6.59) bulk out a meal, while sauces such as Curry Sauce (£2.75), Gravy (£2.75) and Mayo Pot (£1.45) cost extra."},{"heading":"Menu range and value","body":"The menu spans 156 items across 21 categories, making it broad enough for most tastes. Prices run from budget deals—the Pie & Chips Deal at £6.50 and Kids Meal at £5.99—to heartier plates like the Large Fish Meal for Two (£33) or Mixed Kebab in Pita (£12.09).\n\nSpecial offers provide good value: the 1/2lb Beef Burger Meal is £8.60, Medium Sausage with Regular Chips £5, and Large Battered Sausage with Large Chips £7. Chips alone range from Small (£2.75) to Large (£4.95), with cheesy variants adding £1.10–£1.10 more.\n\nVegetarian options exist but are limited: Veggie Burger (£5.50), Tasty Falafel Wraps (£5.50), and salads including Tuna Salad and Chicken Salad (both £8.79) or Steam Fish Salad (£10.99). Healthy Options also appear as a separate section.\n\nDrinks range from bottled soft drinks (£4.39 for Coca Cola, Sprite or Fanta) to cans at £2.19 and energy drinks at £2.19. Kulfi ice lollies (£7.15 for full size, £2.75 for sticks) and a Hot Battered Mars Bar (£2.75) finish a meal. Carry bags cost from £0.15 (plastic) to £0.39 (white)."},{"heading":"Location, hours and halal status","body":"Salt & Vinegar Oxford Ltd is at 78 Rose Hill, Iffley, Oxford OX4 4HS. The restaurant is open Monday to Saturday, 4–11 pm, and closed on Sundays. Phone 01865 770134 to order.\n\nHalal status is not specified on the restaurant's listing. If halal meat is important to you, contact the restaurant directly on 01865 770134 to confirm which products are halal and which suppliers they use."}],"wordCount":520,"quality":{"pass":true,"reasons":[]},"source":{"about_raw":"Salt & Vinegar Oxford Ltd\n\nSalt & Vinegar Oxford Ltd is a fish and chips takeaway at 78 Rose Hill, Iffley, Oxford (OX4 4HS). Its Google categories are fish and chips takeaway, fast food restaurant and meta_description":"Sangam Balti House, Preston. Indian curries, tandoori, biryani and nans. Open Mon–Sun 5–10pm. Takeaway and dine-in.","intro":"Sangam Balti House is an Indian restaurant on Hope Terrace in Lostock Hall, Preston. It serves curries, tandoori dishes, biryanis and breads, with options for sit-down meals and takeaway orders.","sections":[{"heading":"About Sangam Balti House in Preston","body":"Sangam Balti House is located at 15 Hope Terrace, Lostock Hall, Preston PR5 5RU. The restaurant is open Monday to Sunday, 5–10pm on weekdays and 5–10:30pm on Friday and Saturday. It is closed on Tuesday. The menu lists 78 items across starters, mains, sides and breads, with prices ranging from under £1 for chutneys and sauces to around £18 for set meals for one.\n\nThe restaurant takes dine-in bookings and accepts takeaway orders. Google reviews note that groups of up to 16 can be accommodated, and customers may bring their own alcohol. Typical spend is given as £10–30 per person."},{"heading":"What to order at Sangam Balti House","body":"Starters range from Onion Bhaji and Chicken Tandoori at £3.95 to a Special Deluxe Platter at £9.50. The Chicken Tikka Pakora costs £4.25, and a Royal Starter is £7.95.\n\nTandoori and grilled dishes include Chicken Tikka (Main) at £9.95, Paneer Tikka (Main) at £11.50, Lamb Chops (Main) at £13.95, and Tandoori King Prawn (Main) at £16.95. The Tandoori Mix Grill (Main) is £12.95.\n\nBiryani dishes start at £9.95 for Vegetable Biryani or Chicken Biryani. Lamb Biryani costs £12.95, and King Prawn Biryani is £17.95.\n\nSide dishes include Aloo Gobi, Bombay Potato, Cauliflower Bhaji and Tarka Daal, all at £4.45. Rice and chips options range from Boiled Rice at £2.75 to Special Pilau at £4.75. Breads include Plain Nan at £2.75, Garlic Nan and Peshwari Nan at £3.25 each, and Garlic & Cheese Nan at £4.25.\n\nSet meals offer better value for groups: a Set Meal for 2 is £35.95, for 3 is £55.95, and for 4 is £71.95. BBQ Party Bags are available for £29.95 (for 2) or £54.95 (for 4). A Vegetable Thaly is £30.95 and a Meat Thaly is £32.95."},{"heading":"Menu and pricing","body":"The menu spans appetisers, starters, tandoori and shashlik mains, biryanis, English dishes, kids meals, thalys and set meals. Vegetarian options include Vegetable Biryani, Paneer Tikka (Main), Aloo Gobi, Bombay Potato, Cauliflower Bhaji, Mushroom Bhaji, Sag Bhaji, Tarka Daal, Vegetable Bhaji and Vegetable Pilau. Kids meals feature Chicken Tikka Masala, Chicken Korma, Chicken Curry and Chicken Nuggets & Chips, each under £10. Fried Scampi & Chips and Chicken Nuggets & Chips are listed under English Dishes at £9.95 each.\n\nAppetisers and sides cost under £5. Starters range from £3.95 to £9.50. Main dishes range from around £9.95 for curries to £17.95 for King Prawn Biryani. Set meals and party bags provide value for eating with others, starting at £18.95 for one person and rising to £71.95 for four."},{"heading":"Halal status, location and visiting Sangam Balti House","body":"Sangam Balti House is listed as a halal restaurant on halalresmenu.com. To confirm halal status and any specific certifications, customers should contact the restaurant directly on 01772 628616.\n\nThe restaurant is at 15 Hope Terrace, Lostock Hall, Preston PR5 5RU. Opening hours are Monday, Wednesday, Thursday and Sunday 5–10pm; Friday and Saturday 5–10:30pm; closed Tuesday. Phone 01772 628616 to book or place a takeaway order."}],"wordCount":528,"quality":{"pass":true,"reasons":[]},"source":{"about_raw":"Sangam Balti House\n\nSangam Balti House is an Indian restaurant at 15 Hope Terrace, Lostock Hall, Preston (PR5 5RU). Its Google categories are Indian restaurant, Asian restaurant and South Asian restaurant. It has 4.5 stars on Google from 284 reviews. Google lists opening hours of 5–10 pm Monday, Wednesday, Thursday and Sunday; 5–10:30 pm Friday and Saturday, and shows it closed on Tuesday. Google puts the typical spend at £10–30 per person.\n\nIts own webs ure seafood collection features substantial plates: Monkfish with Orange Sauce (£22.95), Coconut and Chilli Haddock (£21.95), Bengal King Prawns (£21.95) and Tandoori King Prawns with Sweet Chilli Sauce (£21.95). Whole fish options include Sea Bass and Tandoori Trout, both at £20.95.\n\nFor curries, the Traditionals section offers classic styles like Dhansak, Korma, Bhuna and Vindaloo, all at £8.95 per portion. Spice Merchants Favourites cost £9.95 and include Tikka Masala, Jalfrezi, Karahi, Garlic Chilli and Naga.\n\nBiryani dishes range from Vegetable Biryani (£13.95) to Venison Biryani and Kachchi Biryani (both £19.95). Mid-range options include Chicken Biryani (£14.95), Lamb Biryani (£16.95), and King Prawn Biryani (£18.95).\n\nChef's Collection specials include Shank of Lamb (£22.95), Shan Bhuna (£15.95), Nihari Lamb (£16.95) and Royal Venison (£17.95).\n\nSides include Tarka Dal, Aloo Gobi and Saag Aloo (all £5.25), and Saag Paneer (£5.50). Breads include Naan (£3.75), Garlic Naan (£3.95), Keema Naan (£4.25) and Peshwari Naan (£3.95). Rice options start at Plain Rice (£4.50) and include Pilau Rice (£4.75) and Special Fried Rice (£4.95)."},{"heading":"Menu, prices and options","body":"Spice Merchants menu spans 177 items with typical spend at £20–30 per person. Starters run from £5.50 (Onion Bhaji, Meat Samosa) to £7.95 (Mixed Fish), with most tikka dishes at £5.95–£7.50.\n\nMain courses range widely: traditional curries at £8.95, Spice Merchants Favourites at £9.95, Chef's Collections from £9.95–£22.95, and signature seafood mains at £15.95–£22.95. Biryanis span £13.95–£21.95.\n\nVegetarian and vegan options are available throughout. Starters include Vegetable Samosa (£5.50), Sweet Chilli Paneer (£6.50) and Garlic Mushroom Tikka (£6.50). Sides feature Bombay Aloo, Aloo Gobi, Saag Aloo and Tarka Dal (all £5.25), plus Saag Paneer and Matar Paneer (£5.50 each). Vegetable Biryani and Mushroom Biryani cost £13.95 each. Rice dishes include Vegetable Pilaw and Mushroom Pilaw (both £4.95). Breads range from Chapati (£2.95) to filled naans like Peshwari Naan and Kashmiri Naan (£3.95 each).\n\nParapadams and chutneys are available as sides: Papadams and Masala Papadams at £0.95, Chutney Tray (£2.40), and individual chutneys such as Mango Chutney, Lime Pickle and Onion Chutney (all £0.95)."},{"heading":"Visiting Spice Merchants: location and hours","body":"Spice Merchants is at 44 Osborne Road, Southsea, Portsmouth, PO5 3LT. The restaurant is open every day from 5 pm to midnight. You can call 023 9282 8900 to place an order or ask about availability.\n\nThe restaurant is listed as halal; we recommend confirming halal status directly with the restaurant before ordering."}],"wordCount":574,"quality":{"pass":true,"reasons":[]},"source":{"about_raw":"Spice Merchants\n\nSpice Merchants is an Indian restaurant at 44 Osborne Rd, Southsea, Portsmouth, Southsea (PO5 3LT). Its Google categories are Indian restaurant and takeaway. It has 4.5 stars on Google from 645 reviews. Google shows it open every day from 5 pm–12 am. Google puts the typical spend at £20–30 per person.\n\nIts Uber Eats menu has 177 items, in sections such as “Papadams & Chutneys”, “Starters” and “Signature Seafoods”. Many of the reviews describe takeaway or delivery orders.\n\nOf the 8 reviews Google shows first, 7 are positive (4 or 5 stars) and 1 is negative (1 or 2 stars).\n\nPositive reviews praise the mixed grill, chicken dhansak, a Yorkshire pudding starter, soft lamb, a very clean, romantic room and friendly staff, with customers going for 15 years.\n\nThe lowest-rated reviews mention a delivery taking 1 hour 22 minutes, an order sent to the wrong address, overcooked lamb and vegetable curry with tasteless naan and unseasoned biryani, lamb chops of tiny bony pieces, a prawn paneer with two pieces each, a handwritten bill, a chicken bhuna that seemed left over, and over £60 for two for poor food.\n\nSources: Google Maps https://www.google.com/maps/place/?q=place_id:  kitchen is open to view, and the restaurant offers a separate vegan menu alongside its main offering. The menu spans 52 items across appetisers, lockdown specials, side dishes, main courses and rice and bread options."},{"heading":"What to order at Wah Ji Wah","body":"Start with Bhelpuri (£5.95), a crisp street snack available in vegan or vegetarian versions, or try the Pav Bhaji (£7.95), a spiced potato and pea curry with bread. The Seekh Kebab Gilafi (£9.50) and Paneer Tikka Anardana (£7.95) are popular appetiser choices. For something different, the Honey Dill Salmon (£12.95) offers fish-based variety.\n\nMain courses include Murg Tikka Masala (£11.95), Chicken Jalfrezi (£11.95) and Lamb Rogan Josh (£14.95). The Dum Ki Biryani range covers Chicken, Lamb, Prawns and Vegetables, all at £16.95, with an upgraded Prawn Biryani at £17.95. For larger appetites, the Curry by Weight section offers portions in 250g, 500g and 1kg sizes: a 1kg Lamb Biryani costs £28.95, and a 1kg Lamb curry is £28.95.\n\nSide dishes include Tadka Dal (£6.50), Punjabi Chana Massala (£6.50), Achari Baingan Aloo (£6.95) and Palak Ki Bhaji (£7.50), with vegan and vegetarian options. Paneer Butter Masala (£10.95) is a vegetarian main course alternative. Breads range from Plain Naan (£3.50) to Peshawari Naan (£4.25) and Stuffed Kulcha (£4.95). Add Steamed Rice (£3.95) or Pulao Rice (£4.50) to any meal."},{"heading":"Menu and prices at Wah Ji Wah","body":"The menu typically costs £10–40 per person. Appetisers range from £5.50 to £12.95. Main courses run £9.95 to £17.95, with the larger Curry by Weight portions and Biryani Buckets extending to £30 for 1kg Lamb Biryani. Side dishes are £6.50 to £8.95, and rice and breads are £3.50 to £4.95.\n\nVegan and vegetarian options appear across appetisers, sides and mains. The Chilli Garlic Mushroom, Bhelpuri, Onion Bhaji, Achari Baingan Aloo, Palak Ki Bhaji, Aloo Gobhi Adraki and Bhindi Massaledar are offered in both vegan and vegetarian versions. Drinks include J2O, Coca-Cola and Diet Coke at £4.25 each."},{"heading":"Halal status, location and hours","body":"Wah Ji Wah is listed as halal. To confirm current halal certification or standards, contact the restaurant on 0161 819 5460 or visit in person.\n\nThe restaurant is at 37 King St W, Manchester M3 2PW. It opens at 3 pm Monday to Thursday and closes at 9 pm; on Friday and Saturday it opens at 3 pm and closes at 10 pm. The restaurant is closed on Sunday."}],"wordCount":483,"quality":{"pass":false,"reasons":["certification mentioned but not in about_raw"]},"source":{"about_raw":"Wah Ji Wah\n\nWah Ji Wah is an Indian restaurant at 37 King St W, Manchester (M3 2PW). It has 4.3 stars on Google from 697 reviews. Google lists opening hours of 3–9 pm Monday to Thursday; 3–10 pm Friday and Saturday, and shows it closed on Sunday. Google puts the typical spend at £10–40 per person.\n\nIts Just Eat menu has 52 items, in sections such as “Appetisers”, “Lockdown Specials” and “Side Dishes”.\n\nOf the 8 reviews Google shows first, 5 are positive (4 or 5 stars) and 3 are negative (1 or 2 stars).\n\nDishes named in positive reviews include the kebabs, lamb biryani, lamb jalfrezi, bhel puri, pani puri, paneer masala and calamari, and reviewers mention a separate vegan menu, weekday discounts and an open kitchen. Several positive reviews mention friendly, welcoming staff. Others also mention generous portions, quick service and good value for money.\n\nThe lowest-rated reviews mention very small portions for the price, service charges, being charged more than the menu price for a pot of tea, problems redeeming an advertised offer, staff questioning a prepaid card, a poor mutton biryani and undercooked food at a birthday meal.\n\nSources: Google Maps https://www.google.com/maps/place/?q=place_id:ChIJl_7bxa-xe0gRYG3U6rOjcYo | Rating 4.3 | 697 Google reviews | 14 reviews read (8 most relevant + 6 lowest rated, from the logged-out Google listing) | Phone 0161 819 5460 | Website https:/ , momos, and biryani, with options for vegetarians and meat-eaters, and a full range of breads and rice.","sections":[{"heading":"What to order at Wembley Tandoori","body":"The tandoori section is strong. Tandoori Chicken (Half) costs £8.25, and the Tandoori Mix Grill at £17.95 combines multiple meats cooked in the tandoor. Chicken Jalfrezi (£10.25) and Lamb Karahi (£10.95) are popular curries. If you want Nepalese flavours, try Sekuwa (Chicken) for £7.95 or Sekuwa (Lamb) at £8.95—both marinated in Nepalese spices and grilled.\n\nFor starters, Chilli Paneer (£8.95), Paneer Tika Starter (£9.95), and Veg Momo (£8.95) suit vegetarians. Lamb Sheekh Kebab (£9.95) and Chicken 65 (£8.95) are popular meat options. Momos—steamed dumplings—come in chicken, lamb, and vegetable versions, all £9.95. Tandoori King Prawn (£15.95) is the premium seafood starter.\n\nMain courses include Chicken Tikka Masala (£10.25), Butter Chicken (£10.25), and Lamb Rogan Josh (£9.95). Vegetarians can order Saag Paneer (£8.95), Channa Masala (£7.95), or Paneer Tikka Masala (£9.95). Biryani dishes—baked rice with meat—run from £9.95 for Vegetable Biryani to £12.95 for Prawn Biryani. Chicken Biryani is £10.95 and Lamb Biryani £11.25.\n\nBreads are affordable: Butter Naan and Garlic Naan are both £2.95, Peshawari Naan £3.95. Rice options include Plain Rice (£2.95), Pilau Rice (£3.95), and Jeera Rice (£4.95). Hakka noodles—Vegetable, Chicken, or Prawn—range from £8.95 to £11.50."},{"heading":"Menu and prices at Wembley Tandoori","body":"The menu has over 120 items across starters, mains, sides, and drinks, with prices typically between £2.50 and £17.95. Starters range from Papadum and Chutney (£1.30) to premium items like Tandoori King Prawn (£15.95). Main courses sit mostly between £7.95 and £14.95. Typical spending is £10–50 per person.\n\nVegetarian options are available throughout: starters like Onion Bhaji (£5.50) and Veg Momo (£8.95), mains like Bhindi Masala (£8.50) and Daal Makhani (£7.95), and vegetable biryani and rice dishes. The menu includes allergen information for some items, noting where dishes contain nuts or dairy.\n\nDrinks are budget-friendly: cans of Sprite, Pepsi, and Fanta are £1 each, and 2-litre bottles cost £3."},{"heading":"Location, hours and how to visit","body":"Wembley Tandoori is at 133 Wembley Park Drive, Wembley Park, Wembley (postcode HA9 8HQ). It is open daily from 5 pm to 11 pm. Phone 020 8902 2243 to book or order. The restaurant is a minute from Wembley Park Tube station, making it convenient for the stadium and nearby venues. There is a disabled toilet on the ground floor.\n\nThe restaurant is listed as halal on halalresmenu.com. For confirmation of halal status and specific certification, contact the restaurant directly on the number above."}],"wordCount":442,"quality":{"pass":false,"reasons":["restaurant name missing","certification mentioned but not in about_raw"]},"source":{"about_raw":"Wembley Tandoori - Bar and Indian Nepalese Restaurant\n\nWembley Tandoori - Bar and Indian Nepalese Restaurant is an Indian restaurant at 133 Wembley Park Dr, Wembley Park, Wembley (HA9 8HQ). Its Google categories are Indian restaurant, Indian takeaway, Nepalese restaurant and restaurant. It has 4.2 stars on Google from 735 reviews. Google shows it open every day from 5–11 pm. Google puts the typical spend at £10–50 per person.\n\nIts Just Eat menu has 124 items, in sections such as “Vegetable Starters”, “Non Veg Starters” and “Seafood Starters”. The reviews cover both sit-down meals and takeaway or delivery orders.\n\nAll 8 of the reviews Google shows first are positive (4 or 5 stars).\n\nPositive reviews mention the chicken jalfrezi, Nepalese dishes and decor, its location a minute from Wembley Park Tube, handy for the stadium and shows, and a disabled toilet on the ground floor. Several positive reviews mention friendly, welcoming staff, a pleasant atmosphere and fresh food. Others also mention quick service.\n\nThe lowest-rated revie with prices from £1.50 to £33.99. The restaurant is listed as halal and customers should confirm current certification status by calling the restaurant.","sections":[{"heading":"About Wing's of King's in Brockley","body":"Wing's of King's operates from 445 Brockley Road, SE4 2PJ, in the Brockley area of south-east London. It is a fast food chicken shop that operates long hours: 11 am to 1 am Monday to Thursday, 11 am to 2 am Friday and Saturday, and 12 pm to midnight on Sunday. The restaurant is listed as halal; contact them on 020 8699 8487 to confirm current halal certification details.\n\nOn Google, the restaurant holds a 4.1-star rating from 85 reviews. Positive feedback frequently highlights fresh food cooked in front of customers, wings, generous portions and friendly staff. Some negative reviews mention consistency issues with portion sizes, sauce application and food quality, so it may be worth checking your order before leaving."},{"heading":"What to order at Wing's of King's","body":"The menu covers several distinct categories. For wings, try the Peri Peri Wing's meal (6 wings for £8.99 or 12 wings for £12.99), BBQ Wings (6 pieces for £4.99), or 6 Spicy Wings with fries and drink for £6.99.\n\nBurger options include the Chicken Fillet Burger at £4.49, Double Chicken Fillet Burger (£9.99 in a meal), Quarter Pounder (£4.99) and Half Pounder (£6.49), plus the Fish Burger (£4.99) and Veg Burger (£4.49). The Grilled Peri Peri Burger comes as a burger only (£4.99) or with a meal (£7.99).\n\nFor chicken pieces, order from the Extras section: Just Chicken from 1 piece (£1.79) up to 10 pieces (£14.99), or BBQ Chicken (1 piece for £1.99, 6 pieces for £10.99). The Chicken Meal section offers combinations like 1 piece chicken with fries and drink (£5.49) or 2 piece chicken with fries and drink (£7.49).\n\nFamily and mixed buckets serve groups: Family Buckets start at £19.99 (6 chicken and 6 wings) rising to £33.99; Mixed Buckets range from £14.99 to £29.99. Wraps include the Peri Peri Chicken Wrap (£5.49 wrap only, £8.99 with a meal) and Chicken Wrap (£4.99).\n\nSides include regular fries (£2.99), large fries (£4.49), Chicken Popcorn (£3.99 regular, £4.99 large), Onion Rings (£3.49 regular, £4.49 large), Coleslaw and Beans (£1.49 small, £2.99 large each). Sauce dips cost 50p each (mayo, ketchup, BBQ, garlic, chilli)."},{"heading":"Menu prices and value","body":"Typical spend is £1–10 per person. Kid's meals are all priced at £4.99 and include a drink, fries and a main: 1 piece chicken, 4 spicy wings, nuggets, steak burger or other options. Individual burger prices range from £3.29 (Beef Burger) to £6.99 (Double Fillet), with add-ons such as hash browns or onion rings pushing combo meals to £9.99.\n\nMeal deals are generally good value. A 6 Spicy Wings meal costs £6.99, while a 2-piece chicken meal is £7.49. The larger Peri Peri Wing's meal at 12 wings for £12.99 offers volume. Family Buckets are designed for groups; the base option (6 chicken and 6 wings) is £19.99, and the largest mixed bucket (12 chicken, 4 fries, 1.5L drink and beans or coleslaw) is £24.99.\n\nThe menu includes a Veg Wrap (£4.99) and Veg Burger (£4.49), though most offerings centre on chicken, lamb ribs and beef burgers. Drinks range from 50p sauce dips to canned drinks at £1.50 each, or 1.5L bottles (cola, 7UP, Fanta, Tango) at £3.49."},{"heading":"Location, hours and halal status","body":"Wing's of King's is at 445 Brockley Road, London SE4 2PJ. Phone 020 8699 8487 for enquiries.\n\nOpening hours are Monday to Thursday 11 am–1 am, Friday and Saturday 11 am–2 am, and Sunday 12 pm–midnight.\n\nThe restaurant is listed as halal on halalresmenu.com. For confirmation of current halal certification status and details of any certifier, call the restaurant directly on 020 8699 8487."}],"wordCount":658,"quality":{"pass":false,"reasons":["certification mentioned but not in about_raw"]},"source":{"about_raw":"Wing's of King's\n\nWing's of King's is a chicken shop at h, Manchester, offering a large menu of curries, biryanis, tandoori dishes and kebabs for delivery or collection. With 200 items ranging from traditional curry dishes at around £7 to specialist masalas and house specials, there's substantial choice for different spice levels and proteins.","sections":[{"heading":"What to order at Yarana","body":"The core menu centres on traditional curry dishes available in eight styles: Plain Curry, Bhuna, Dansak, Korma, Madras, Rogan Josh, Dopiaza and Vindaloo. A Chicken Plain Curry costs £6.90, while King Prawn versions of the same dish are £8.50. The Bhuna range offers similar protein options at the same prices, providing a drier sauce alternative to the traditional curries.\n\nBiryanis span eleven varieties from £7.50 to £9.95. The Chicken Biryani is £7.95, while the Tandoori Chicken Biryani and Yarana Special Desi Biryani both cost £8.95. King Prawn Biryani is the most expensive single item at £9.95.\n\nTandoori specialities include a Tandoori Chicken 1/2 at £6.95, Tandoori Mixed Grill at £8.50, and King Prawn Tandoori at £8.50. Tikka Tandoori Specialities with chicken or lamb are £6.95 each. The Tandoori Chops Bhuna, listed under Yarana Specials, costs £9.50.\n\nChef's Recommendations feature dishes like Yarana House Special (£8.30), Chicken Silsila (£8.30), Special Garlic Chicken (£8.30), and King Prawn Balti Garlic (£9.95). Chicken Tikka Masala and Tandoori Chicken Masala are both £7.90, while the Tandoori King Prawn Masala is £9.50.\n\nKebabs range from £5 to £6.95. The Donner Meat Kebab is the cheapest at £5.00, while a Chicken and Lamb Mix Kebab costs £6.90. Kebab options on naan include Chicken Tikka on Naan and Lamb Tikka on Naan, both at £5.90.\n\nFor vegetarians, Plain Curry (Vegetable) is £6.50, and the Vegetable Thali for one is £14.50. Side dishes include Aloo Gobi, Bombay Potato, and Tarka Dhal at £3.80 each, plus Vegetable Bhaji at £3.40."},{"heading":"Menu range and prices","body":"Yarana's menu spans approximately 200 items across 22 categories. Main curry dishes typically range from £6.50 for vegetable options to £8.50 for king prawn versions. Most traditional curries (chicken, meat, prawn) cost between £6.90 and £6.95, with tikka and specialist meat proteins around £7.50.\n\nBiryanis start at £7.50 for vegetable options and go up to £9.95 for King Prawn. Set meals offer value for groups: a Set Meal for Two is £26, for Four is £48, and a Tandoori Feast for Two costs £33.95.\n\nBreads are inexpensive: a plain Naan is £2.80, Garlic Naan £2.90, and flavoured varieties like Peshwari, Chilli and Cheese Naan at £3.00 each. Rice dishes range from £2.80 for Boiled Rice to £3.20 for Special Fried Rice, Keema Rice and vegetable varieties.\n\nStarters fall into two tiers. Traditional starters like Chicken Tikka Starter and Shami Kebab (2 pieces) cost £4.50, while Onion Bhaji (4 pieces) and samosas are £4.00. Signature starters cost between £3.50 (Garlic Mushroom) and £5.80 (Tandoori Chops), with items like Tandoori Chicken 1/4 and Reshmi Kebab at £4.50.\n\nSpecialist masalas, baltis and karahi dishes range from £6.95 to £9.95 depending on protein. A Chicken Karahi is £6.95, while a King Prawn Karahi costs £8.95. Seafood dishes like Seafood Balti and Fish Bhuna are both £8.50.\n\nChildren's meal deals cost £5.50 to £6.50, while thalis range from £14.50 (vegetable) to £16.00 (meat). Sides, chutneys and pickles are kept separate and cost £0.80 to £3.20."},{"heading":"Halal status, location and hours","body":"Yarana is listed on halalresmenu.com as a halal restaurant. However, customers should confirm the halal status directly with the restaurant to ensure their requirements are met.\n\nThe restaurant is located at 700 Oldham Road, Failsworth, Manchester M35 9FB. It can be contacted on 0161 682 5349.\n\nOpening hours are 5:00 pm to 11:30 pm Monday to Thursday and Sunday. On Friday and Saturday, Yarana opens at 5:00 pm and closes at midnight, allowing for late-night orders on weekends."}],"wordCount":634,"quality":{"pass":true,"reasons":[]},"source":{"about_raw":"Yarana\n\nYarana is an Indian takeaway at 700 Oldham Rd, Failsworth, Manchester (M35 9FB). Its Google categories are Indian takeaway and Indian restaurant. It has 4 stars on Google from 99 reviews. Google lists opening hours of 5–11:30 pm Monday to Thursday and Sunday; 5 pm–12 am Friday and Saturday. Google puts the typical spend at £10–20 per person.\n\nIts Just Eat menu has 200 items, in sections such as “Traditional Curry Dishes”, “Currys with Vegetables” and “Biryani Dishes”.\n\nOf the 8 reviews Google shows first, 5 are positive (4 or 5 stars) and 3 are negative (1 or 2 stars).\n\nPositive reviews mention curries with plenty of meat that arrive fresh and piping hot, fair prices and polite service, though one says orders can take a while.\n\nThe lowest-rated reviews mention a chicken tikka kebab made of scraps, rubbery doner and dry chicken in mixed kebabs, a prawn korma with few prawns, a bland meat thali, an overly thick curry, a cold delivery in a soggy pizza box and trouble giving a postcode by phone.\n\nSources: Google Maps https://www.google.com/maps/place/?q=place_id:ChIJceVsdTq3e0gRpMNsC1QZvy4 | Rating 4 | 99 Google reviews | 13 reviews read (8 most relevant + 5 lowest rated, from the logged-out Google listing) | Phone 0161 682 5349 | Website https://www.yaranafailsworth.co.uk/ | Hours from Google | Menu: Just Eat UK https://www.just-eat.co.uk/restaurants-yarana/menu","menu_json":{"source":"restaurant_menu","categories":[{"name":"Traditional Curry Dishes","items":[{"name":"Plain Curry (Chicken)","description":null,"price":6.9},{"name":"Plain Curry (Meat)","description":null,"price":6.9},{"name":"Plain Curry (Prawn)","description":null,"price":6.95},{"name":"Plain Curry (King Prawn)","description":null,"price":8.5},{"name":"Plain Curry (Chicken Tikka)","description":null,"price":7.5},{"name":"Plain Curry (Lamb Tikka)","description":null,"price":7.5},{"name":"Plain Curry (Speci  Tofu (£14.90), Tofu Curry (£14.90), Chilli Salt & Pepper Tofu (£10.90) or Broccoli Floret with Garlic (£11.50). Chicken Satay Skewers (£12.50) and 1/4 Crispy Aromatic Duck (£18.50) are appetiser-style options also served as mains. Roti Canai comes as two pieces (£10.50) or one (£6.50), and Egg Fried Rice (£6.90) or Coconut Rice (£5.00) work as sides. Desserts include Bubur Hitam (£6.50) and Ketayap (£6.00)."},{"heading":"Menu and prices","body":"Zheng's typical spend is £20–30 per person. Starters range from Prawn Crackers (£3.90) to Admiral Zheng Wasabi King Prawn (£14.90). Most mains fall between £14.90 and £22.90, with fish dishes at the higher end. Sides like Plain Boiled Rice (£4.50) and Egg Fried Rice (£6.90) are budget-friendly. Sauce accompaniments—Sambal Sauce (£3.00), Satay Sauce (£2.00), Belacan Sauce (£3.00)—are charged separately. Drinks include Coke, Diet Coke and 7 Up at £2.50 each, and Fever Tree Light Tonic Water at £1.00.\n\nOff-menu specials such as Aromatic Soy Seabass (£23.50) and Sweet and Sour Chicken (£13.90) are also available. The menu includes options described as less oily, with no MSG or reduced sugar on request."},{"heading":"Location, hours and contact","body":"Zheng is at 82 Walton St, Oxford, OX2 6EA. Phone 01865 511188 to order or book. Opening hours are 12:00–2:30 pm and 5:00–10:30 pm Monday to Friday; 12:00–3:00 pm and 5:00–11:00 pm Saturday; 12:00–3:00 pm and 5:00–10:00 pm Sunday. The restaurant is closed on Tuesday. The address is listed as halal; customers should confirm halal status with the restaurant directly."}],"wordCount":387,"quality":{"pass":true,"reasons":[]},"source":{"about_raw":"Zheng\n\nZheng is a Malaysian restaurant at 82 Walton St, Oxford (OX2 6EA). Its Google categories are Malaysian restaurant and takeaway. It has 4.4 stars on Google from 803 reviews. Google lists opening hours of 12–2:30 pm, 5–10:30 pm Monday and Wednesday to Friday; 12–3 pm, 5–11 pm Saturday; 12–3 pm, 5–10 pm Sunday, and shows it closed on   <script>
    const drafts = JSON.parse(document.getElementById("draft-data").textContent);
    const main = document.getElementById("main");
    const q = document.getElementById("q");
    const failOnly = document.getElementById("failOnly");
    const stats = document.getElementById("stats");

    function esc(s) {
      if (s == null) return "";
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function renderArticle(d) {
      if (!d.intro && !(d.sections && d.sections.length)) {
        return '<p class="intro"><em>No generated article' + (d.error ? " — " + esc(d.error) : "") + '</em></p>';
      }
      let h = '<div class="article"><p class="intro">' + esc(d.intro || "") + '</p>';
      for (const s of d.sections || []) {
        h += '<h3>' + esc(s.heading) + '</h3>';
        for (const para of (s.body || "").split(/\n\n+/)) {
          if (para.trim()) h += '<p>' + esc(para.trim()) + '</p>';
        }
      }
      h += '</div>';
      return h;
    }

    function render() {
      const term = q.value.trim().toLowerCase();
      const onlyFail = failOnly.checked;
      let visible = 0;
      main.innerHTML = "";
      if (!drafts.length) {
        main.innerHTML = '<div class="empty">No drafts yet. Run npm run generate:about:batch</div>';
        stats.textContent = "";
        return;
      }
      for (const d of drafts) {
        const pass = d.quality && d.quality.pass;
        if (onlyFail && pass) continue;
        const hay = [d.slug, d.name, d.city, d.cuisine_type].join(" ").toLowerCase();
        if (term && !hay.includes(term)) continue;
        visible++;
        const card = document.createElement("article");
        card.className = "card" + (pass ? "" : " fail");
        card.dataset.slug = d.slug;
        const mt = d.meta_title || "";
        const md = d.meta_description || "";
        let reasons = "";
        if (d.quality && d.quality.reasons && d.quality.reasons.length) {
          reasons = "<ul class=\"reasons\">" + d.quality.reasons.map(r => "<li>" + esc(r) + "</li>").join("") + "</ul>";
        }
        const menuJson = d.source && d.source.menu_json != null
          ? JSON.stringify(d.source.menu_json, null, 2)
          : "";
        card.innerHTML =
          '<div class="card-header">' +
            '<h2>' + esc(d.name) + ' <span class="len">(' + esc(d.city || "—") + ')</span></h2>' +
            '<span class="badge ' + (pass ? "pass" : "fail") + '">' + (pass ? "PASS" : "FAIL") + '</span>' +
          '</div>' +
          '<p class="len"><code>' + esc(d.slug) + '</code> · ' + (d.wordCount || 0) + ' words</p>' +
          reasons +
          '<dl class="meta-block">' +
            '<dt>Meta title <span class="len">(' + mt.length + ' chars)</span></dt><dd>' + esc(mt) + '</dd>' +
            '<dt>Meta description <span class="len">(' + md.length + ' chars)</span></dt><dd>' + esc(md) + '</dd>' +
          '</dl>' +
          renderArticle(d) +
          '<details class="source"><summary>Source: about.txt &amp; menu</summary>' +
            '<p><strong>about.txt</strong></p><pre>' + esc((d.source && d.source.about_raw) || "") + '</pre>' +
            '<p><strong>menu_data</strong></p><pre>' + esc(menuJson) + '</pre>' +
          '</details>';
        main.appendChild(card);
      }
      const passN = drafts.filter(x => x.quality && x.quality.pass).length;
      stats.textContent = visible + " shown · " + drafts.length + " drafts · " + passN + " PASS · " + (drafts.length - passN) + " FAIL";
      if (visible === 0) main.innerHTML = '<div class="empty">No matches</div>';
    }

    q.addEventListener("input", render);
    failOnly.addEventListener("change", render);
    render();
  </script>
